<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositories - Open Code Review Viewer</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="breadcrumb"><a href="/" class="nav-brand"><span class="brand-icon"></span>Open Code Review Viewer</a></nav>
<main>
<h2>Repositories</h2>
{{if .Repos}}
<div class="search-container" style="margin-bottom: 1rem;">
    <input type="text" id="repoSearch" placeholder="Search repositories..." 
           style="width: 100%; padding: 0.5rem; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
</div>
<table class="table" id="reposTable">
    <thead><tr><th>Repository</th><th>Sessions</th><th>Last Modified</th></tr></thead>
    <tbody>
    {{range .Repos}}
        <tr>
            <td><a href="/r/{{.EncodedPath}}">{{.EncodedPath}}</a></td>
            <td>{{.SessionCount}}</td>
            <td>{{formatTime .LastModified}}</td>
        </tr>
    {{end}}
    </tbody>
</table>
<p id="noResults" style="display: none; text-align: center; padding: 1rem; color: #888;">No repositories found matching your search.</p>
<script>
(function() {
    var searchInput = document.getElementById('repoSearch');
    var table = document.getElementById('reposTable');
    var noResults = document.getElementById('noResults');
    var rows = table.querySelectorAll('tbody tr');

    searchInput.addEventListener('input', function(e) {
        var filter = e.target.value.toLowerCase();
        var visibleCount = 0;
        rows.forEach(function(row) {
            var repoName = row.querySelector('td:first-child a').textContent.toLowerCase();
            if (repoName.includes(filter)) {
                row.style.display = '';
                visibleCount++;
            } else {
                row.style.display = 'none';
            }
        });
        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        table.style.display = visibleCount === 0 ? 'none' : '';
    });
})();
</script>
{{else}}
<p>No session data found. Run a code review first.</p>
{{end}}
</main>
</body>
</html>
